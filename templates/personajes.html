<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>RPG Manager - Personajes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4">Gestión de Personajes RPG</h1>
        
        
    <h2>Lista de Personajes</h2>
    <form action="/personajes" method="POST">
        <label>Nombre:</label>
        <input type="text" name="nombre">
    
        <label>Clase:</label>
        <input type="text" name="clase_personaje">

        <label>Nivel:</label>
        <input type="number" name="nivel">

        <label>Vida:</label>
        <input type="number" name="vida">

        <button type="submit">Crear Personaje</button>
    </form>

    <ul>
        {% for p in personajes %}
            <li>{{ p.nombre }} - {{ p.clase_personaje }} (Nivel: {{ p.nivel }}, Vida: {{ p.vida }})</li>
        {% endfor %}
    </ul>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>    
</html>
